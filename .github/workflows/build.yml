name: Build

# Builds the app from a clean checkout on macOS, Windows and Linux with the
# same commands as the "Build from source" section of the README. If this
# workflow passes, those commands work on every platform.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build, comma-separated: macos, windows, linux"
        type: string
        default: macos,windows,linux

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the platforms: all three on push and pull request, the ones asked
  # for when started by hand (for example "windows,linux").
  plan:
    # Actions minutes are free on public repositories but counted on private
    # ones (macOS at 10x): there, the build only runs when started by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'macos,windows,linux' }}
        run: |
          set -euo pipefail
          all='[{"platform":"macos","os":"macos-latest","bundles":"dmg"},
                {"platform":"windows","os":"windows-latest","bundles":"nsis"},
                {"platform":"linux","os":"ubuntu-22.04","bundles":"deb,appimage"}]'
          wanted="$(printf '%s' "$PLATFORMS" | tr '[:upper:]' '[:lower:]' | tr ', ' '\n\n' | sed '/^$/d' | sort -u)"
          while IFS= read -r p; do
            case "$p" in
              macos|windows|linux) ;;
              *) echo "::error::Unknown platform '$p': use macos, windows, linux"; exit 1 ;;
            esac
          done <<< "$wanted"
          matrix="$(jq -c --arg wanted "$wanted" '{include: [.[] | select(.platform as $p | $wanted | split("\n") | index($p))]}' <<< "$all")"
          [ "$(jq '.include | length' <<< "$matrix")" -gt 0 ] || { echo "::error::No platform selected"; exit 1; }
          echo "Building: $(jq -r '[.include[].platform] | join(", ")' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Angular 22 needs Node ^22.22.3, ^24.15.0 or >=26: pin it instead of
      # relying on the runner image default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # One version for the desktop shell and the web UI; the npm launcher
      # follows PromptOps Desktop releases and is only tested here.
      - name: Versions and npm launcher
        run: |
          node scripts/versions.mjs check
          (cd apps/npm && node --test test/*.test.mjs)

      # The release build plus the debug test build no longer fit in the free
      # space of the Ubuntu image: drop preinstalled toolchains we never use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Linux system packages (README, step 1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file cmake clang \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev

      - name: Tool versions
        run: |
          node --version
          npm --version
          rustup show active-toolchain || rustup default stable
          cargo --version
          cmake --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the app
        working-directory: apps/desktop
        run: npm run build -- --bundles ${{ matrix.bundles }}

      # The built app must start and keep running: a missing system library,
      # a panic in setup or a broken bundle fails here instead of on a user's
      # machine. Each run gets an empty home folder.
      - name: Smoke start (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          app="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          [ -n "$app" ] || { echo "::error::No AppImage was built"; exit 1; }
          chmod +x "$app"
          export HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          # Extract-and-run: the runner has no FUSE, users who lack it get the same path.
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout --kill-after=10 45 "$app" > "$RUNNER_TEMP/smoke.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/smoke.log"
          if [ "$status" -ne 124 ]; then
            echo "::error::PromptOps exited after start (status $status) instead of running for 45 s"
            exit 1
          fi
          if grep -q "panicked at" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::PromptOps panicked during start"
            exit 1
          fi
          echo "PromptOps kept running for 45 s."

      - name: Smoke start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release -Filter *.exe |
            Where-Object { $_.Name -notmatch 'build-script|deps' } | Select-Object -First 1
          if (-not $exe) { throw "No app executable in target/release" }
          $out = Join-Path $env:RUNNER_TEMP smoke-out.log
          $err = Join-Path $env:RUNNER_TEMP smoke-err.log
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 45
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($p.HasExited) { throw "PromptOps exited after start (code $($p.ExitCode)) instead of running for 45 s" }
          if (Select-String -Path $err -Pattern 'panicked at' -Quiet) { throw "PromptOps panicked during start" }
          Stop-Process -Id $p.Id -Force
          Write-Output "$($exe.Name) kept running for 45 s."

      - name: Desktop tests
        working-directory: apps/desktop/src-tauri
        # A stuck test fails here with its log, instead of using up the job.
        timeout-minutes: 20
        run: cargo test --lib

      # Formatting is the same everywhere; lints are checked on macOS, the
      # platform the codebase is kept warning-free on.
      - name: Rust format and lints
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --lib --all-targets -- -D warnings

      - name: CLI and replay tests
        working-directory: apps/desktop
        run: |
          npm run test:cli
          node --test test/*.test.cjs

      - name: Web tests
        if: runner.os == 'Linux'
        working-directory: apps/web
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          node --test test/*.test.cjs
          npx ng test --watch=false --browsers=ChromeHeadless --no-progress

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptops-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
